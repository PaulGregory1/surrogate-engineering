[project]
name = "engine-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy",
  "torch",
  "sse-starlette>=2.1",
  "claude-agent-sdk",  # drives the local `claude` CLI — auth via `claude login`, no API key
  "anyio",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
