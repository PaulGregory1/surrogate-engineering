[project]
name = "stressgnn"
version = "0.1.0"
description = "Mesh-native graph-network surrogate for linear-elastic stress fields on parametric geometries."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "gmsh>=4.11",
    "tqdm>=4.65",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stressgnn", "stressgnn.models"]
