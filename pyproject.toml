[project]
name = "flowsurrogate"
version = "0.1.0"
description = "Learned surrogates for a 2-D lattice-Boltzmann flow solver, with gradient-based shape optimisation."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flowsurrogate", "flowsurrogate.models"]
